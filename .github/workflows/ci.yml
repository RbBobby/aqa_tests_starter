name: Tests and Allure report
run-name: CI — ${{ github.ref_name }} — @${{ github.actor }}

on:
  workflow_dispatch:

permissions:
  contents: read

# Pages hosts the latest completed run. Do not interrupt its deployment.
concurrency:
  group: tests-and-pages
  cancel-in-progress: false

jobs:
  api:
    name: "1. API / ${{ matrix.suite }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [smoke, regress]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run API tests
        env:
          SUITE: ${{ matrix.suite }}
        run: python -m pytest tests/tests_api -v -m "api and $SUITE" --alluredir=allure-results --clean-alluredir
      - name: Save Allure results even when tests fail
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-api-${{ matrix.suite }}
          path: allure-results/
          if-no-files-found: warn
          retention-days: 14

  ui:
    name: "2. UI / ${{ matrix.suite }} (placeholder)"
    needs: api
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        suite: [smoke, regress]
    steps:
      - name: UI tests are not implemented yet
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          echo "UI $SUITE: placeholder; no tests were executed." >> "$GITHUB_STEP_SUMMARY"
          # Future command: python -m pytest tests/tests_ui -m "ui and $SUITE" --alluredir=allure-results

  report:
    name: 3. Combined Allure report
    needs: [api, ui]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download results from all layers
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Allure CLI
        env:
          ALLURE_VERSION: 2.32.0
        run: |
          curl --fail --location --retry 3 "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz" -o "$RUNNER_TEMP/allure.tgz"
          tar -xzf "$RUNNER_TEMP/allure.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/allure-${ALLURE_VERSION}/bin" >> "$GITHUB_PATH"
      - name: Generate combined report
        env:
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          mkdir -p allure-results
          printf 'Branch=%s\nCommit=%s\nUI=Not implemented\n' "$BRANCH" "$COMMIT" > allure-results/environment.properties
          allure generate allure-results --clean -o allure-report
      - name: Save HTML report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14
      - name: Prepare Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report/

  deploy:
    name: 3. Publish to GitHub Pages
    needs: report
    if: ${{ !cancelled() && needs.report.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy report
        id: deployment
        uses: actions/deploy-pages@v5
